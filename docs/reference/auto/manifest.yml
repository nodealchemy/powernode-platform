# Auto-generated documentation manifest
# Each entry describes how a file in docs/reference/auto/ is regenerated.
#
# Tracking policy:
#   tracked: true   → file is committed (source = static code, manual regen)
#   tracked: false  → file is gitignored (source = runtime DB, nightly regen)
# See docs/reference/auto/README.md for the rationale.

- filename: mcp-tools.md
  tracked: true
  generator: bundle exec rails mcp:generate_tool_catalog
  source: Ai::Tools::PlatformApiToolRegistry.all_tools (server/app/services/ai/tools/platform_api_tool_registry.rb)
  # .all_tools is TOOLS.merge(extension_tools), so the rendering depends on which
  # extension engines are loaded. The TRACKED copy is the PUBLIC-bundle rendering;
  # scripts/check-mcp-catalog-fresh.sh pins that environment when it regenerates.
  cadence: on-tool-class-change (manual)

- filename: skills.md
  tracked: false
  generator: bundle exec rails mcp:sync_docs
  source: ai_skills table (status=active, enabled=true; capped at 50 entries per scope)
  cadence: nightly via AiKnowledgeDocSyncJob (5:30 AM UTC)

- filename: knowledge-base.md
  tracked: false
  generator: bundle exec rails mcp:sync_docs
  source: ai_shared_knowledges table (quality_score >= 0.5; capped at 100 entries per scope)
  cadence: nightly via AiKnowledgeDocSyncJob (5:30 AM UTC)

- filename: knowledge-graph.md
  tracked: false
  generator: bundle exec rails mcp:sync_docs
  source: ai_knowledge_graph_nodes + ai_knowledge_graph_edges (active nodes with confidence >= 0.3; 75 nodes / 150 edges)
  cadence: nightly via AiKnowledgeDocSyncJob (5:30 AM UTC)

- filename: learnings.md
  tracked: false
  generator: bundle exec rails mcp:sync_docs
  source: ai_compound_learnings table (status IN active/verified, importance >= 0.5 OR confidence >= 0.7; capped at 100 entries per scope)
  cadence: nightly via AiKnowledgeDocSyncJob (5:30 AM UTC)

- filename: todo.md
  tracked: false
  generator: bundle exec rails mcp:sync_docs
  source: ai_shared_knowledges table (tagged "todo"; capped at 100 entries; platform-scoped only)
  cadence: nightly via AiKnowledgeDocSyncJob (5:30 AM UTC)
