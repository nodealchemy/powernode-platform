# Core capability skills — domain: powernode-platform-dev (part A).
# Powernode-specific: these may name Powernode paths, scripts and CLAUDE.md rules.
# Procedure and checklists only; no deployment-local facts, counts or ids.

- slug: dev-loop-execution
  name: Dev-Loop Task Execution
  category: code_intelligence
  description: 'Use when working one claimed dev-improve or campaign task end to end: re-verify the claim, red spec first, minimal fix, verify, commit on the loop branch, report.'
  tags:
  - dev-loop
  - ralph-loop
  - dev-improve
  - task-execution
  - finding-routing
  domain: powernode-platform-dev
  capability: dev-loop-execution
  triggers:
    use_when:
    - a dev-improve or campaign loop task has been claimed and must be driven to a reported outcome
    - a dev-loop finding must be routed as an improvement, an issue or an escalation
    - a claimed task needs its finding re-verified against current code before any change
    - a task outcome (passed, failed, blocked, skipped) must be reported with evidence
    not_for:
    - writing or shaping the failing spec itself — use test-authoring
    - running several loop tasks at once across worktrees — use powernode-concurrent-tasks
    - creating, auditing or removing the worktree — use powernode-worktree-lifecycle
    - a campaign increment's proposal, approval and merge protocol — use campaign-increment-protocol
    keywords:
    - dev-loop
    - dev-improve
    - task
    - claim
    - finding
    - improvement
    - issue
    - escalate
    - outcome
    - loop branch
    - commit
    - red first
    - migration
    - spec
    - fix
    - report
    applies_to:
    - powernode-platform
    stages:
    - build
    - test
  manifest:
    verbs:
    - dev_next_task
    - dev_complete_task
    - dev_update_task
    - dev_list_tasks
    - query_learnings
    - code_file_skeleton
    - code_blast_radius
    - create_improvement
    - report_issue
    - escalate
    - create_learning
    knowledge_tags:
    - guidance-dev-loop-verification
    - guidance-verification-gate
    - guidance-trace-to-request
    - guidance-git-conventions
    - guidance-submodule-safety
    gate_category: mutate
    read_only: false
  hints:
    min_tier: standard
    effort: medium
    long_context: false
    tool_heavy: true
    safety_critical: false
  relations:
    requires:
    - test-authoring
    composes: []
    refines: []
  evals:
  - task: Work a dev-improve task that adds a migration and a spec
    expect_selected: true
    project_kind: powernode-platform
  - task: 'Route a dev-loop finding: improvement, issue or escalate'
    expect_selected: true
    project_kind: powernode-platform
  - task: Claim the next dev-improve task, fix it red-first and report the outcome
    expect_selected: true
    project_kind: powernode-platform
  - task: Clean up merged worktrees after the drain
    expect_selected: false
  - task: Set up CI for a customer's Node app
    expect_selected: false
  system_prompt: |
    # Dev-loop task execution

    ## Before you change anything
    1. Hold exactly one claimed task. If `dev_next_task` returned `halted` or `queue_empty`, report that and stop.
    2. Read the task: key, acceptance criteria, `metadata.files`, `metadata.repro`, loop guardrails. `reclaimed: true` means resume: inspect the worktree and loop branch for partial work first.
    3. Re-verify the claim against current code. Findings rot.
       - `query_learnings` for the area; `code_file_skeleton` / `code_blast_radius` on the named files; read only the relevant sections.
       - Never run a mutating repro against a live database; reproduce inside a spec on the test DB.
       - Claim no longer holds → report `passed` with the evidence that it is already resolved. Do not invent work.

    ## Do the work
    4. Confirm the repo before any git step: `git rev-parse --show-toplevel`. Work on the loop branch named by the loop, never on develop or master.
    5. Red first: write the failing spec that reproduces the finding, run it, and confirm it fails for the stated reason.
    6. Minimal fix that traces to the acceptance criteria. No adjacent improvements, no placeholders. Changes touching 3+ files: outline files and data flow first.
    7. Verify: the new spec green, the nearest existing spec file for touched code green, `npx tsc --noEmit` when frontend files changed, Ruby syntax on touched `.rb` files. Targeted specs only, never the full suite mid-loop.

    ## Commit (only when the loop or operator asks for commits)
    - One commit per passed task, message `fix(<area>): <task_key> <summary>`.
    - Extension files: commit inside the submodule first; stage specific paths, never `git add -A`; no pointer bump mid-loop.
    - Never push. No AI attribution lines.
    - When acceptance criteria require independent review, stop before committing and hand the diff to the driver for review; never self-review.

    ## Route findings you discover on the way
    - In scope of this task → fix it here.
    - Real but out of scope, code-level and actionable → `create_improvement` with file, symptom and suggested check.
    - A defect that needs an owner decision or affects users → `report_issue`.
    - Architecture fork, permission or policy question, or a decision only the operator can make → `escalate` (or report `blocked` with the options laid out). Never guess an operator decision.

    ## Report
    Call `dev_complete_task` with: `outcome` (passed | failed | blocked | skipped), `summary` written for the operator, `check_results` (spec files and results), `files_changed`, `git_branch`, `commit_sha` for a pass, `learnings_used` (ids you actually applied), and one `learning` only if the task taught something non-obvious.

    ## Stop rules
    - 3 failed attempts at the same fix → report `failed` with what was tried. No fourth approach.
    - Scope expansion or genuine design fork → report `blocked`.
    - Kill switch or halt at any point → stop, change nothing more, report where the task was left.
- slug: rails-backend-conventions
  name: Rails API Backend Conventions
  category: database_ops
