  evals:
  - task: Add a migration and a new model association in the Rails API
    expect_selected: true
    project_kind: powernode-platform
  - task: Add a new Rails service and controller endpoint with a permission check
    expect_selected: true
    project_kind: powernode-platform
  - task: Add a JSON column with a default to an existing model
    expect_selected: true
    project_kind: powernode-platform
  - task: Fix a hardcoded color in a React page
    expect_selected: false
  - task: Add a model and migration to a customer's Django app
    expect_selected: false
    project_kind: software
  system_prompt: |
    # Rails API backend conventions

    ## Before writing
    1. Reuse first: `code_semantic_search` for an existing service, concern or registry seam; `search_knowledge_graph` for the entity relationships; `query_learnings` for gotchas in the area.
    2. `code_blast_radius` before renaming or moving any shared symbol.
    3. Changes touching 3+ files: outline the files and data flow and get approval first.

    ## Models and migrations
    - Every table: `id: :uuid` with the `uuidv7()` default; Ruby-side ids via `UUID7.generate`, never `SecureRandom.uuid`.
    - `t.references` already creates the index; customise it inline (`index: { unique: true }`), never a separate `add_index` for a reference column.
    - Namespaced associations pair `class_name: "Ai::Thing"` with `foreign_key: "ai_thing_id"` (namespace prefix on the FK).
    - JSON attributes use lambda defaults: `default: -> { {} }`.
    - Regenerate `schema.rb` in core mode only; it must contain only core and public extension tables.
    - Iterating associations: `.includes(...)` — no bare `.all` followed by relation access.
    - A deploy that must stay migration-free: use existing columns or metadata and confirm the fields exist first.

    ## Services and controllers
    - `# frozen_string_literal: true` in every Ruby file; `Rails.logger` only.
    - Controllers in `Api::V1`, inherit ApplicationController, respond with `render_success` / `render_error`, stay under the size limit by moving query logic to services.
    - Permissions: `current_user.has_permission?('name')`; never `permissions.include?` and never roles.
    - Cross-namespace calls go through a service interface, not another namespace's models.
    - Inbound webhooks return 200/202 on processing errors, never 500.
    - Never create job classes in `server/app/jobs/` and never add Sidekiq to the server Gemfile; background work goes to the worker over the HTTP API.

    ## Seeds
    - `db/seeds.rb` is an orchestrator; a new core seed file needs an explicit load line there.
    - Idempotent: complete on the first run, a no-op on the second; upsert on a stable natural key; version and counter columns create-only.
    - One writer at a time against a database.

    ## Verify
    - Ruby syntax on touched files; the related spec green; `migration_status` when migrations changed.
    - Run `scripts/validate.sh` or its targeted subset before reporting done.

    ## Stop rules
    - A change would make core depend on an extension → stop and route it through a seam.
    - 3 failed attempts at the same fix → stop and ask.
