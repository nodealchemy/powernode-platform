  evals:
  - task: Add a new React page with a permission-gated action button
    expect_selected: true
    project_kind: powernode-platform
  - task: Replace hardcoded Tailwind colors with theme classes and fix tsc errors
    expect_selected: true
    project_kind: powernode-platform
  - task: Add a migration for a new backend table
    expect_selected: false
  - task: Build a landing page for a customer's marketing website
    expect_selected: false
  system_prompt: |
    # React frontend conventions

    ## Before writing
    1. `code_semantic_search` for an existing component, hook or shared primitive; reuse before creating.
    2. `query_learnings` for the feature area (state, forms, data fetching patterns).
    3. Check the shared UI primitives before adding a local one.

    ## Rules
    - Access control by permissions only: `currentUser?.permissions?.includes('x.y')`. Never roles, never `user.role`.
    - Theme classes only (`bg-theme-*`, `text-theme-*`); no hardcoded colors.
    - Page actions live in the PageContainer, not inside page content.
    - Flat navigation: no submenus.
    - Global notifications only; no local success or error banners.
    - Cross-feature imports through `@/shared/` and `@/features/`; no deep relative imports.
    - No `console.log`: use the shared logger. No `any`: type it properly.
    - New interactive elements get a `data-testid`.
    - Extension UI is mounted through the feature registry, never imported directly into core.

    ## Steps
    1. Make the minimal change that traces to the request.
    2. Run `cd frontend && npx tsc --noEmit` after any TypeScript change; fix every new error.
    3. Run the related Jest test with `CI=true npm test -- <path>`; add one when behaviour changed.
    4. Check the edit-time hook warnings (color, any, console, permission) and resolve them rather than baselining them.

    ## Checklist before reporting
    - [ ] tsc clean
    - [ ] related test green
    - [ ] no role-based checks, hardcoded colors, `any` or `console.log` introduced
    - [ ] permissions used match ones the backend actually enforces

    ## Stop rules
    - 3 failed attempts at the same fix → stop and ask.
- slug: extension-development
  name: Extension Boundary Development
  category: code_intelligence
  description: 'Use when building inside an extension under extensions/ or touching the core/extension seam: registries, seeds, submodule commits, purity.'
  tags:
  - extensions
  - submodules
  - core-purity
  - seams
  - engine
  domain: powernode-platform-dev
  capability: extension-development
  triggers:
    use_when:
    - adding models, tables, permissions, seeds or tools inside an extension
    - core needs a capability that an extension provides, so a generic seam is required
    - committing changes that span the core repo and an extension submodule
    - a core purity or extension isolation check fails
    not_for:
    - ordinary Rails API changes inside core — use rails-backend-conventions
    - ordinary React changes inside core — use frontend-conventions
    - releasing or bumping published versions — use release-promotion
    keywords:
    - extension
    - submodule
    - engine
    - seam
    - registry
    - core purity
    - isolation
    - pointer bump
    - core mode
    - table prefix
    - register
    - plugin
    applies_to:
    - powernode-platform
    stages:
    - build
  manifest:
    verbs:
    - code_blast_radius
    - code_semantic_search
    - code_context_tree
    - search_knowledge
    knowledge_tags:
    - guidance-extension-isolation
    - guidance-extension-db-contributions
    - guidance-submodule-safety
    - guidance-architecture-invariants
    gate_category: read
    read_only: true
  hints:
    min_tier: standard
    effort: high
    long_context: false
    tool_heavy: false
    safety_critical: false
  relations:
    requires: []
    composes: []
    refines: []
  evals:
  - task: Add a seed and a permission to an extension without core depending on it
    expect_selected: true
    project_kind: powernode-platform
  - task: Commit a change that spans core and an extension submodule
    expect_selected: true
    project_kind: powernode-platform
  - task: Fix a role check in a frontend page
    expect_selected: false
  - task: Write a WordPress plugin for a customer site
    expect_selected: false
  system_prompt: |
    # Extension boundary development

    ## The invariant
    Core never depends on an extension: no extension namespace, path or import alias in core source, seeds or prompts. Extensions depend on core. One extension never references another.

    ## Before writing
    1. Decide the owner: the repo that owns the capability owns the code, seeds, verbs and agents. Core-mode installs must still work without it.
    2. `code_semantic_search` for an existing core seam (registries for permissions, roles, audit actions, skill domains and categories, tools, seeds, frontend slots, bridges).
    3. No seam fits → design a generic one in core that names no extension, and let the extension register into it at boot.

    ## Inside the extension
    - Tables carry the extension's table prefix; migrations live in the extension's `server/db/migrate/` in its band.
    - Permissions, roles and audit tokens are registered from the engine, prefixed with the extension's namespace.
    - Seeds run from the extension's seed orchestrator, are idempotent, and are listed explicitly (no globbing of smoke or example files).
    - Frontend pages mount through the feature registry and are gated on the extension being present.

    ## Commits
    1. Survey both: `git status` in core and `git -C extensions/<name> status`.
    2. Before every add or commit: `git rev-parse --show-toplevel` and `git branch --show-current`.
    3. Commit inside the submodule first, then bump the pointer in core as a separate commit.
    4. Never commit extension files from the parent. Never run `git submodule sync` on the public submodules.

    ## Verify both modes
    - Extension specs run from core `server/` with a relative path to the extension spec.
    - Core purity hook and `scripts/pattern-validation.sh` extension-isolation check stay clean (no new baseline entries).
    - Seeds, zeitwerk and permission checks pass with the extension enabled and absent.

    ## Stop rules
    - The only working shape makes core name the extension → stop and ask for a seam decision.
    - 3 failed attempts → stop and ask.
