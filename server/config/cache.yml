default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies  
    max_size: 268435456  # 256 MB
    namespace: "powernode_cache"

development:
  <<: *default

test:
  <<: *default

production:
  database: cache
  # Entry VALUES are encrypted at rest with Active Record Encryption. Keys are
  # stored as written, so never put a credential in a cache key. Powernode::CacheEncryptionGuard refuses to boot
  # production without it or without the three AR encryption keys.
  encrypt: true
  <<: *default
