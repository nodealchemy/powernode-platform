# Internal seam write doors with NO cross-account tenancy case yet.
# Checked by spec/requests/api/v1/internal/internal_seam_worker_tenancy_spec.rb.
#
# The spec DERIVES every mutating route under /api/v1/internal/ from the router
# and requires a tenancy case for each one, except the doors named here. This
# list records the doors that predate the derivation (2026-09-11); it is not a
# list of doors that are safe. Some are legitimately cross-account (fleet-wide
# sweeps, account lifecycle and GDPR erasure run by the system worker) and some
# have simply never been checked. Each is visible here so it can be worked off.
#
# THE ORACLE IS EQUALITY, AND THE LIST ONLY SHRINKS.
# - A NEW mutating internal door is never added here. It gets a tenancy case in
#   the spec (a CASE, WALK_CASE or SWEEP_CASE), or the guard fails by name.
# - An entry that now has a case, or whose route is gone, is stale and fails:
#   delete it, and lower uncovered_ceiling in the spec in the same change.
# - uncovered_ceiling pins this list's size, so growing it takes two edits, and
#   the second is a number whose comment says never to raise it.
