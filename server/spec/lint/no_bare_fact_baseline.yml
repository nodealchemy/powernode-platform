# no-bare-fact baseline — APO, design §2 of
# docs/reference/platform-presentation-design-2026-09-05.md
#
# Every entry is a FILE that today returns a bare general noun, or a constant
# status, from a tool result builder. They are recorded rather than fixed
# because a zero-baseline lint would have failed on day one and been reverted;
# named here they are counted, visible and workable, and anything NEW fails.
#
# THE ORACLE IS EQUALITY, per file and per rule. A count that rises is a
# regression. A count that DROPS is progress and must be lowered here in the
# same change — a ceiling left above what the tree holds is a ratchet that has
# stopped ratcheting. An entry whose file has no offences left is stale and
# fails; delete it.
#
# TO CLEAR AN ENTRY: give the key its scope noun, so it says WHAT it counts
# (`agent_execution_errors`, not `errors`), or make a constant status an
# actual measurement. Then lower or delete the line below.
#
# Generated by the scanner in spec/lint/no_bare_fact_result_keys_spec.rb, which
# is the same code that checks it — a baseline produced by a second
# implementation would drift from the one enforcing it.
