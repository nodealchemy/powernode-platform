<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Viewport: allows user scaling by default (WCAG 2.1 AA) -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme color (Chrome, Edge, Safari, Opera; Firefox ignores gracefully) -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />

    <meta name="format-detection" content="telephone=no" />

    <!-- Primary Meta Tags -->
    <title>Powernode — Mission control for AI agent fleets</title>
    <meta name="title" content="Powernode — Mission control for AI agent fleets" />
    <meta
      name="description"
      content="Open-source control plane for production AI agent fleets. Run agents on your infrastructure with knowledge-graph memory, MCP-native skill execution, swarm coordination, real-time kill switches, and per-action governance. MIT-licensed, self-hostable."
    />
    <meta name="keywords" content="AI agents, agent orchestration, MCP, fleet management, knowledge graph, open source, self-hosted, MIT, agent ops, agent observability, agent governance, multi-agent, autonomy" />
    <meta name="author" content="Powernode" />

    <!-- Canonical -->
    <link rel="canonical" href="/" />

    <!-- Open Graph / Facebook / LinkedIn / Slack unfurl -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="Powernode — Mission control for AI agent fleets" />
    <meta property="og:description" content="Open-source control plane for production AI agent fleets. Knowledge graph + governance + swarm coordination, all MIT-licensed." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Powernode — Mission control for AI agent fleets" />
    <meta property="og:site_name" content="Powernode" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="/" />
    <meta name="twitter:title" content="Powernode — Mission control for AI agent fleets" />
    <meta name="twitter:description" content="Open-source control plane for production AI agent fleets. Knowledge graph + governance + swarm coordination, all MIT-licensed." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Powernode — Mission control for AI agent fleets" />

    <!-- Schema.org JSON-LD: Organization + WebSite + SoftwareApplication.
         Relative URLs resolve against the page being crawled, so this works
         for any deployment without per-instance configuration. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "/#org",
            "name": "Powernode",
            "url": "/",
            "logo": "/logo192.png",
            "description": "Open-source control plane for production AI agent fleets."
          },
          {
            "@type": "WebSite",
            "@id": "/#website",
            "url": "/",
            "name": "Powernode",
            "description": "Mission control for AI agent fleets — open source.",
            "publisher": { "@id": "/#org" },
            "inLanguage": "en-US"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "/#software",
            "name": "Powernode",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Linux, macOS, Windows (containerized)",
            "description": "Open-source control plane for production AI agent fleets. Knowledge graph + MCP-native skill execution + swarm coordination + real-time governance, all MIT-licensed and self-hostable.",
            "url": "/",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "license": "https://opensource.org/licenses/MIT"
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
