# Contributor License Agreement (CLA) gate
# ---------------------------------------------------------------------------
# DRAFT / LEGAL REVIEW PENDING.
#
# This workflow blocks pull requests from contributors who have not signed the
# Powernode CLA (see /CLA.md). The CLA itself is a DRAFT pending legal review
# and is NOT yet in force. Do NOT enable this gate until Node Alchemy LLC has
# adopted a final, counsel-reviewed CLA.
#
# SAFE BY DEFAULT
#   Out of the box this workflow does NOTHING that can block a PR. The actual
#   CLA check is guarded by a repository (or organization) variable named
#   `CLA_ENABLED`. Until a maintainer sets `CLA_ENABLED=true`, the job runs a
#   single informational step and exits successfully — so merging this file
#   will not break CI for existing contributors.
#
# ---------------------------------------------------------------------------
# MAINTAINER SETUP (required before this gate does anything)
#
#   1. Finalize and adopt /CLA.md (legal review complete).
#
#   2. Create a signatures store. The CLA-assistant action records who has
#      signed by committing to a JSON file in a Git repository. Create a
#      PRIVATE repo (e.g. nodealchemy/cla-signatures) with an empty file at
#      `signatures/version1/cla.json` containing: {}
#      (Or point `path-to-signatures` at a file in THIS repo if you prefer a
#      public signature ledger — your call, but private is the common choice.)
#
#   3. Add a Personal Access Token (classic) with `repo` scope on the
#      signatures store as a repository secret named `CLA_SIGNATURES_TOKEN`.
#      The built-in GITHUB_TOKEN cannot write to a *separate* repo, which is
#      why a dedicated PAT is needed. If the signature file lives in THIS repo,
#      a token with write access to this repo is sufficient.
#         Settings -> Secrets and variables -> Actions -> New repository secret
#
#   4. PIN THE ACTION. The `uses:` line below is intentionally left UNPINNED
#      (no version/SHA) so this file cannot silently run third-party code on
#      `pull_request_target` (which has access to secrets). Before enabling,
#      replace `contributor-assistant/github-action` with a specific commit
#      SHA you have reviewed, e.g.:
#         uses: contributor-assistant/github-action@<reviewed-commit-sha>
#      Pin to a full 40-char SHA, not a tag — tags can be moved.
#
#   5. Flip the gate on:
#         Settings -> Secrets and variables -> Actions -> Variables tab
#         New repository variable: CLA_ENABLED = true
#      (Set it as an *organization* variable to enable across all public repos
#      at once.)
#
#   6. (Optional) Adjust `allowlist` below for bots/maintainers that should be
#      exempt (e.g. dependabot[bot], your release bot).
#
# After setup, a new contributor's PR is blocked with a comment asking them to
# reply with the agreed signature sentence; their PR check goes green once they
# have signed. Removing step 5's variable (or setting it to anything but
# `true`) instantly returns the workflow to its safe no-op state.
# ---------------------------------------------------------------------------

name: CLA

on:
  # pull_request_target is required: forks need access to the signatures store
  # secret to record/verify a signature. Because this event runs in the context
  # of the BASE repo (with secrets), the workflow does NOT check out or execute
  # any code from the PR head — it only runs the pinned, reviewed action below.
  pull_request_target:
    types: [opened, synchronize, reopened]
  # The action also listens to issue_comment so a contributor can sign by
  # commenting the agreed sentence on their PR.
  issue_comment:
    types: [created]

# Least privilege. The action needs to read PRs and write status comments;
# writing the signature file itself uses CLA_SIGNATURES_TOKEN, not this token.
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # Safe-by-default notice. Always runs; never fails. Visible in the Actions
      # log so maintainers can see why the gate is or isn't active.
      - name: CLA gate status
        run: |
          if [ "${{ vars.CLA_ENABLED }}" = "true" ]; then
            echo "CLA gate ENABLED — pull requests require a signed CLA (see /CLA.md)."
          else
            echo "CLA gate DISABLED (safe no-op). Set repository variable CLA_ENABLED=true to enable."
            echo "See the MAINTAINER SETUP block at the top of .github/workflows/cla.yml."
          fi

      # The actual gate. Only runs once a maintainer has completed setup AND set
      # CLA_ENABLED=true. Until then this step is skipped entirely, so PRs are
      # never blocked by an unconfigured action.
      #
      # NOTE: `uses:` is deliberately UNPINNED below and MUST be replaced with a
      # reviewed commit SHA (see MAINTAINER SETUP step 4) before enabling. As
      # written, an unpinned reference under pull_request_target should not be
      # left in an enabled state.
      - name: Check CLA signature
        if: vars.CLA_ENABLED == 'true'
        # SETUP REQUIRED: pin to a reviewed SHA, e.g.
        #   uses: contributor-assistant/github-action@<reviewed-commit-sha>
        uses: contributor-assistant/github-action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to the signatures store (see SETUP step 3).
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          # Sentence a contributor comments on their PR to sign.
          path-to-document: 'https://github.com/nodealchemy/powernode-platform/blob/master/CLA.md'
          custom-notsigned-prcomment: >
            Thank you for your contribution. Before we can merge it, please read
            our Contributor License Agreement at /CLA.md and sign it by posting
            the following comment on this pull request.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'

          # SETUP REQUIRED: point these at your signatures store (SETUP step 2).
          # If the signature file lives in a SEPARATE repo, set both remote
          # fields; PERSONAL_ACCESS_TOKEN above must have write access to it.
          path-to-signatures: 'signatures/version1/cla.json'
          remote-organization-name: 'nodealchemy'
          remote-repository-name: 'cla-signatures'
          branch: 'main'

          # Accounts exempt from the gate (bots, maintainers as needed).
          allowlist: 'dependabot[bot],github-actions[bot]'
