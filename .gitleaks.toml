# Gitleaks Configuration for Powernode Platform
# https://github.com/gitleaks/gitleaks
# Run: gitleaks detect --config .gitleaks.toml

title = "Powernode Secret Scanner"

[extend]
# Extend default gitleaks rules
useDefault = true

# Custom rules for Powernode-specific secrets
[[rules]]
id = "powernode-jwt-secret"
description = "Powernode JWT Secret"
regex = '''(?i)(jwt[_-]?secret|secret[_-]?key[_-]?base)\s*[:=]\s*['"]?([a-zA-Z0-9+/=]{32,})['"]?'''
tags = ["jwt", "secret", "powernode"]

[[rules]]
id = "powernode-encryption-key"
description = "Rails Encryption Keys"
regex = '''(?i)(primary[_-]?key|deterministic[_-]?key|key[_-]?derivation[_-]?salt)\s*[:=]\s*['"]?([a-zA-Z0-9+/=]{32,})['"]?'''
tags = ["encryption", "rails", "powernode"]

[[rules]]
id = "stripe-secret-key"
description = "Stripe Secret Key"
regex = '''(?i)sk_live_[a-zA-Z0-9]{24,}'''
tags = ["stripe", "payment", "critical"]

[[rules]]
id = "stripe-test-key"
description = "Stripe Test Key"
regex = '''(?i)sk_test_[a-zA-Z0-9]{24,}'''
tags = ["stripe", "payment", "test"]

[[rules]]
id = "paypal-client-secret"
description = "PayPal Client Secret"
regex = '''(?i)(paypal[_-]?client[_-]?secret|paypal[_-]?secret)\s*[:=]\s*['"]?([a-zA-Z0-9_-]{40,})['"]?'''
tags = ["paypal", "payment", "critical"]

[[rules]]
id = "twilio-auth-token"
description = "Twilio Auth Token"
regex = '''(?i)(twilio[_-]?auth[_-]?token|twilio[_-]?token)\s*[:=]\s*['"]?([a-f0-9]{32})['"]?'''
tags = ["twilio", "sms", "critical"]

[[rules]]
id = "firebase-api-key"
description = "Firebase API Key"
regex = '''(?i)AIza[0-9A-Za-z_-]{35}'''
tags = ["firebase", "google", "critical"]

[[rules]]
id = "database-url"
description = "Database Connection URL"
regex = '''(?i)(postgres|mysql|mongodb)://[^:]+:[^@]+@[^/]+/[^\s'"]+'''
tags = ["database", "credentials", "critical"]

# hub-backend appliance `powernode-rails-exec`: its DATABASE_URL is PASSWORDLESS
# (postgres://powernode@localhost... -- trust auth on loopback), but the rule's
# [^:]+ takes "powernode@localhost" as the user and [^@]+ runs across ~40 lines to
# the shell's "$@" further down. AND-scoped to this rule, this one file and a match
# that starts with that exact literal and whose FIRST "@" after it is "$@": a
# password added to the URL changes the prefix, and a credentialed URL inserted
# below it supplies an earlier "@" that is not "$@" -- both still fail. The path
# is not anchored to extensions/system/ because the pre-critic gate's ext-gitleaks
# scan runs with the extension checkout as its source root. (IMP-35fee69707e9;
# replaces the rails-start.sh path entry, whose DATABASE_URL line moved here.)
[rules.allowlist]
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)modules/powernode-hub-backend/rootfs/usr/local/bin/powernode-rails-exec$''']
regexes = ['''\Apostgres://powernode@localhost:5432/powernode_production"[^@]*\$@''']

[[rules]]
id = "redis-url"
description = "Redis Connection URL with Password"
regex = '''(?i)redis://:[^@]+@[^/]+'''
tags = ["redis", "credentials"]

# Admin::SystemSettings documents, in comments, the password SHAPES that break
# URI.parse ("my/pass", "p@ss", "p#w", "p?w", "p w" against host "host"); the
# shapes are the point, so they are allowlisted rather than reworded. AND-scoped
# to this rule, this one file and a match that starts with one of those literal
# examples -- any other credentialed redis URL in the file still fails.
# Both allowlists are pinned by scripts/checks/tests/gitleaks_allowlist_narrowness_test.sh.
# (IMP-35fee69707e9)
[rules.allowlist]
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)server/app/services/admin/system_settings\.rb$''']
regexes = ['''\Aredis://:(my/pass|p@ss|p#w|p\?w|p w)@host\b''']

[[rules]]
id = "sendgrid-api-key"
description = "SendGrid API Key"
regex = '''SG\.[a-zA-Z0-9_-]{22}\.[a-zA-Z0-9_-]{43}'''
tags = ["sendgrid", "email", "critical"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''(?i)AKIA[0-9A-Z]{16}'''
tags = ["aws", "cloud", "critical"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
regex = '''(?i)(aws[_-]?secret[_-]?access[_-]?key|aws[_-]?secret[_-]?key)\s*[:=]\s*['"]?([a-zA-Z0-9+/]{40})['"]?'''
tags = ["aws", "cloud", "critical"]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (RSA|DSA|EC|OPENSSH|PGP) PRIVATE KEY-----'''
tags = ["key", "critical"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key Pattern"
regex = '''(?i)(api[_-]?key|apikey|api[_-]?secret)\s*[:=]\s*['"]?([a-zA-Z0-9_-]{20,})['"]?'''
tags = ["api", "generic"]

[[rules]]
id = "oauth-client-secret"
description = "OAuth Client Secret"
regex = '''(?i)(client[_-]?secret|oauth[_-]?secret)\s*[:=]\s*['"]?([a-zA-Z0-9_-]{20,})['"]?'''
tags = ["oauth", "critical"]

# Allowlist - paths and patterns to ignore
[allowlist]
description = "Global Allowlist"

# Ignore specific files and directories
paths = [
    '''\.gitleaks\.toml$''',
    '''\.env\.example$''',
    '''\.env\.sample$''',
    '''\.env\.template$''',
    '''\.env\..*\.example$''',
    '''config/credentials\.yml\.enc$''',
    '''config/master\.key\.example$''',
    '''spec/''',
    '''test/''',
    '''cypress/''',
    '''e2e/''',
    '''docs/''',
    '''node_modules/''',
    '''vendor/''',
    '''tmp/''',
    '''log/''',
    '''logs/''',
    # Integration worktrees are full checkouts of THIS repo (gitignored, but
    # gitleaks --no-git does not honour .gitignore — verified). Scanning them
    # re-scanned the codebase once per worktree: 78,752 files / 2.4G against
    # 93,992 / 1.6G for the tree proper, ~45% of the scan for no new coverage.
    # Tradeoff accepted knowingly: a secret sitting UNCOMMITTED in a worktree is
    # no longer caught by a gate run from the main repo. Each worktree is a full
    # checkout that runs its own gate and pre-commit hook, which is what covers
    # that case — if that ever stops being true, this entry should come out.
    '''\.claude/worktrees/''',
    '''(^|/)\.env$''',
    '''server/db/seeds/''',
    '''scripts/test_''',
    '''scripts/testing/''',
    '''scripts/security-cleanup\.sh$''',
    '''\.github/workflows/''',
    '''server/\.github/workflows/''',
    '''\.gitea/workflows/''',
    '''docker-compose.*\.yml$''',
    '''docker/''',
    '''scripts/systemd/configs/''',
    '''\.test\.(ts|tsx|js|jsx)$''',
    # Extension-specific allowlist (these are submodule files we cannot
    # restructure from the parent repo; entries below cover known false
    # positives, not blanket-disabling extensions/).
    '''extensions/system/agent/cmd/powernode-agent/internal/cli/commit_cmd\.go$''',
    # dev-cell SSH key generator: the private-key rule matches two format
    # STRINGS — a doc comment quoting "-----BEGIN OPENSSH PRIVATE KEY-----"
    # and wrap_pem() which wraps RUNTIME-generated base64 in PEM delimiters.
    # No key material is committed; the key is generated per-instance at call
    # time and returned once for Vault storage, never stored in source.
    '''extensions/system/server/app/services/system/dev_cell/ssh_key_generator\.rb$''',
]

# Ignore specific regex patterns in content
regexes = [
    '''(?i)example[_-]?key''',
    '''(?i)placeholder''',
    '''(?i)your[_-]?api[_-]?key''',
    '''(?i)xxx+''',
    '''(?i)fake[_-]?secret''',
    '''(?i)test[_-]?secret''',
    '''(?i)dummy''',
    '''REPLACE_ME''',
    '''<your[_-]?.*>''',
    '''(?i)YOUR_JWT_TOKEN''',
    '''(?i)YOUR_TOKEN''',
    '''(?i)YOUR_ADMIN_KEY''',
    '''(?i)YOUR_REFRESH_TOKEN''',
    '''(?i)ADMIN_API_KEY''',
    '''(?i)ADMIN_KEY''',
    '''(?i)mock[_-]?token''',
    '''\$\{\{?\s*env\.\w+\s*\}?\}''',
    '''\$\{[A-Z_]+\}''',
    '''\$\$\(cat /run/secrets/''',
]

# Commits to ignore (add SHA hashes of commits with false positives)
commits = []

# Stop words - ignore secrets containing these
stopwords = [
    "example",
    "placeholder",
    "your_api_key",
    "test_key",
    "dummy",
    "fake",
    "sample",
    "redacted",
]
