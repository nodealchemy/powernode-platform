# Dedicated Sidekiq process for trading operations.
# Run with: bundle exec sidekiq -C config/sidekiq_trading.yml
#
# Isolates trading workload from the main Sidekiq process for:
#   - Predictable latency (no queue contention with AI/billing jobs)
#   - Independent scaling (dedicated concurrency pool)
#   - Fault isolation (trading failures don't affect platform operations)

:environment: <%= ENV['WORKER_ENV'] || ENV['RAILS_ENV'] || 'development' %>
:concurrency: <%= ENV.fetch('TRADING_WORKER_CONCURRENCY', '10').to_i %>
:timeout: 300
:verbose: <%= ENV['WORKER_ENV'] == 'development' %>

:queues:
  - [trading_critical, 3]  # Time-sensitive: strategy ticks, price feeds, risk, training
  - [trading_batch, 1]     # Batch operations: evolution, metrics, sweeps, learning

:redis:
  url: <%= ENV.fetch('REDIS_URL', 'redis://localhost:6379/1') %>
  size: <%= ENV.fetch('TRADING_WORKER_CONCURRENCY', '10').to_i + 5 %>
  network_timeout: 5
  pool_timeout: 5

:retry: 3
:dead_timeout_in_seconds: 1209600
:daemonize: false

<% if (ENV['WORKER_ENV'] || ENV['RAILS_ENV'] || 'development') == 'development' %>
:poll_interval: 5
<% else %>
:poll_interval: 10
<% end %>
