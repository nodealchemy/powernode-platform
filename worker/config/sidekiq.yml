# Sidekiq Configuration for Powernode Worker Service
#
# NOTE: Per-queue timeouts are not directly supported in sidekiq.yml.
# For jobs requiring longer timeouts, set custom timeouts in the job
# class using circuit breakers:
#   - AI providers use with_ai_provider_circuit_breaker (600s timeout)
#   - Backend API uses with_backend_api_circuit_breaker (120s timeout)
#
# The global :timeout setting (300s) applies to job execution time.
# Jobs that may exceed this should use their own timeout handling.

:environment: <%= ENV['WORKER_ENV'] || ENV['RAILS_ENV'] || 'development' %>
:concurrency: <%= ENV.fetch('WORKER_CONCURRENCY', '25').to_i %>
:timeout: 300
:verbose: <%= ENV['WORKER_ENV'] == 'development' %>

# Queue configuration (format: [queue_name, weight])
# Higher weight = higher priority
:queues:
  - [critical, 3]                # Critical system operations
  - [high, 3]                    # High priority tasks
  - [subscription_lifecycle, 3]  # Billing lifecycle (renewals, cancellations)
  - [devops_high, 3]             # High priority DevOps operations (pipeline execution, deployment)
  - [system, 3]                  # System extension jobs: NodeInstance provision/sync/control,
                                 # module commit/build, image create, instance pool dispatch.
                                 # WorkerDispatch's DEFAULT_QUEUE = "system".
  - [ai_agents, 2]               # AI agent operations (uses 600s circuit breaker)
  - [ai_conversations, 2]        # AI conversation processing
  - [ai_execution, 2]             # AI team execution (multi-agent orchestration)
  - [ai_orchestration, 2]        # AI orchestration (team execution, skill sync, reviews)
  - [ai_testing, 2]              # AI testing and validation
  - [devops_default, 2]          # Default DevOps queue (step execution, sync)
  - [devops_webhooks, 2]         # DevOps webhook processing
  - [file_processing, 2]         # File uploads/processing
  - [services, 2]                # Service health checks
  - [billing, 2]                 # Billing operations (uses distributed locking)
  - [billing_scheduler, 2]       # Billing scheduling (uses distributed locking)
  - [compliance, 2]              # GDPR compliance operations (terminations, data deletion)
  - [email, 2]                   # Email delivery
  - [reports, 2]                 # Report generation
  - [integrations, 2]            # Third-party integration processing
  - [mcp, 2]                     # MCP server operations
  - [notifications, 1]           # Notification delivery
  - [analytics, 1]               # Analytics cache warmup and processing
  - [schedules, 1]               # General scheduled task processing
  - [webhooks, 1]                # Webhook delivery
  - [maintenance, 1]             # Maintenance tasks (backups, cleanup)
  - [default, 1]                 # Default queue for misc tasks

# NOTE: the `code_intel` queue is intentionally NOT listed here. It is handled
# by a dedicated Sidekiq capsule (see config/application.rb) with its own
# isolated, low-concurrency thread pool, so long-running codebase index/prune
# jobs never head-of-line-block the queues above.

# Redis configuration
:redis:
  url: <%= ENV.fetch('REDIS_URL', 'redis://localhost:6379/1') %>
  size: <%= ENV.fetch('WORKER_CONCURRENCY', '25').to_i + 5 %>
  network_timeout: 5
  pool_timeout: 5

# Job retry configuration
:retry: 3

# Dead job retention (in seconds)
:dead_timeout_in_seconds: 1209600  # 2 weeks

# Process configuration - Note: Sidekiq 7+ doesn't support pidfile/logfile in config
# These must be handled by the process manager (screen/systemd/etc)
:daemonize: false

# Development settings
<% if (ENV['WORKER_ENV'] || ENV['RAILS_ENV'] || 'development') == 'development' %>
:poll_interval: 5
<% else %>
:poll_interval: 15  
<% end %>

# Production settings
<% if (ENV['WORKER_ENV'] || ENV['RAILS_ENV'] || 'development') == 'production' %>
:max_retries: 5
:dead_max_jobs: 10000
<% end %>

# Scheduled jobs configuration (sidekiq-scheduler)
:scheduler:
  :enabled: true
  :dynamic: false
  :listened_queues_only: false
  :schedule:
    # Expire stale DevOps approval tokens hourly
    devops_approval_expiry:
      cron: '0 * * * *'  # Every hour at minute 0
      class: Devops::ApprovalExpiryJob
      queue: default
      description: 'Expire stale DevOps pipeline step approval tokens'

    # Database backup - daily full backup at 2 AM UTC
    daily_database_backup:
      cron: '0 2 * * *'  # Every day at 2:00 AM UTC
      class: Maintenance::ScheduledBackupJob
      queue: maintenance
      args: ['full']
      description: 'Automated daily full database backup'

    # Database backup - weekly schema backup on Sundays at 3 AM UTC
    weekly_schema_backup:
      cron: '0 3 * * 0'  # Every Sunday at 3:00 AM UTC
      class: Maintenance::ScheduledBackupJob
      queue: maintenance
      args: ['schema_only']
      description: 'Automated weekly schema-only backup'

    # Backup cleanup - remove backups older than retention period
    backup_cleanup:
      cron: '0 4 * * *'  # Every day at 4:00 AM UTC
      class: Maintenance::BackupCleanupJob
      queue: maintenance
      description: 'Remove expired backups beyond retention period'

    # Scheduled-report sweep. ScheduledReport rows carry their own next_run_at
    # (daily/weekly/monthly at 08:00 UTC); nothing dispatches them without this
    # trigger, so without the entry Reports::ScheduledReportSweepJob is inert.
    # Every 15 minutes keeps dispatch latency well under the finest schedule
    # granularity. The sweep only reads what is DUE — it is not itself the
    # schedule, and a missed tick is picked up by the next one.
    #
    # NOTE: Reports::CleanupOldReportsJob is deliberately NOT registered here.
    # It destroys report rows and their stored artifacts, so it runs only when
    # explicitly invoked (PdfReportService.cleanup_old_reports).
    scheduled_report_sweep:
      cron: '*/15 * * * *'  # Every 15 minutes
      class: Reports::ScheduledReportSweepJob
      queue: reports
      description: 'Dispatch ScheduledReport rows whose next_run_at has passed'

    # System extension — physical-device claim queue reaper.
    # Drops UnclaimedDevice rows past their 24h TTL.
    # Reference: docs/plans/wondrous-yawning-anchor.md §10.
    expire_unclaimed_devices:
      cron: '0 3 * * *'  # Every day at 3:00 AM UTC
      class: System::ExpireUnclaimedDevicesJob
      queue: maintenance
      description: 'Reap UnclaimedDevice rows past expires_at (24h default TTL)'

    # SDWAN — 90-day audit retention sweep on revoked Sdwan::UserDevice
    # rows. Slice 5 (deferred reaper) of the SDWAN plan.
    sdwan_reap_user_devices:
      cron: '15 3 * * *'  # 3:15 AM UTC, after the unclaimed-devices reaper
      class: Sdwan::ReapUserDevicesJob
      queue: maintenance
      description: 'Reap Sdwan::UserDevice rows revoked >90 days ago + their Vault entries'

    # System extension — fleet-wide Unix identity reaper. Sweeps draining
    # ServiceUser/ServiceGroup rows past the 24h grace window and frees
    # their UIDs/GIDs for reuse once no module still declares them.
    system_identity_reap:
      cron: '20 3 * * *'  # 3:20 AM UTC, after SDWAN device reaper
      class: System::IdentityReaperJob
      queue: maintenance
      description: 'Transition drained ServiceUser/ServiceGroup rows past 24h grace to removed'

    # System extension — SDWAN host-bridge drain reaper. Closes the grace
    # window a non-forced release opens: the HostBridge state machine has no
    # automatic edge out of `draining` and the compiler's `compilable` scope
    # includes it, so without this sweep a released bridge kept serving on
    # the host forever and its short_id was never reclaimed.
    sdwan_host_bridge_reap:
      cron: '25 3 * * *'  # 3:25 AM UTC, after the identity reaper
      class: System::HostBridgeReaperJob
      queue: maintenance
      description: 'Transition drained Sdwan::HostBridge rows past 24h grace to removed'

    # System extension — disk-image publication retention sweep.
    # Two-stage: retire newest > N (default 3) per platform, then purge
    # retired past 7-day grace window. Plan: docs/plans/wondrous-yawning-anchor.md (Phase 2 — Chunk 2).
    expire_old_disk_image_file_objects:
      cron: '30 3 * * *'  # Every day at 3:30 AM UTC (after unclaimed-devices reaper)
      class: System::ExpireOldDiskImageFileObjectsJob
      queue: maintenance
      description: 'Reap old DiskImagePublications: retire above N per platform, purge retired past grace window'

    # MCP OAuth housekeeping — prune the debris of normal connect/disconnect churn:
    # stale MCP sessions, revoked Doorkeeper tokens/grants past retention, and
    # orphaned Dynamic-Client-Registration apps. The worker has no DB access, so the
    # job calls the backend internal endpoint where the pruning actually runs.
    mcp_oauth_housekeeping:
      cron: '40 3 * * *'  # Every day at 3:40 AM UTC (after the other reapers)
      class: Maintenance::McpHousekeepingJob
      queue: maintenance
      description: 'Prune stale MCP sessions, revoked OAuth tokens/grants, and orphaned DCR client registrations'

    # NOTE: System-extension scheduled jobs (e.g. package repository sync)
    # live in extensions/system/worker/config/sidekiq_system.yml and are
    # merged by config/application.rb's generic extension scan, which skips
    # disabled extensions.

    # NOTE: Billing scheduled jobs (billing_scheduler, daily_payment_reconciliation,
    # billing_cleanup) live in the business extension and load only when its worker
    # component is enabled: extensions/private/business/worker/config/sidekiq_billing.yml

    # Account termination processing - every 6 hours
    account_termination_processing:
      cron: '0 */6 * * *'
      class: Compliance::AccountTerminationJob
      queue: compliance
      description: 'Process account terminations after grace period expires'

    # Data retention enforcement - daily at 2 AM UTC
    data_retention_enforcement:
      cron: '0 2 * * *'
      class: Compliance::DataRetentionEnforcementJob
      queue: compliance
      description: 'Enforce data retention policies and cleanup expired data'

    # Docker Swarm cluster sync - every 5 minutes
    swarm_cluster_sync:
      cron: '*/5 * * * *'
      class: Swarm::ClusterSyncJob
      queue: devops_default
      description: 'Sync Docker Swarm cluster state'

    # System instance pool reaper - every 60 seconds.
    # 2-phase tick: recycle stale warming members past timeout,
    # then replenish to bring warming+ready up to target_size.
    # Without this entry the job class exists but never fires —
    # pools stay wedged at warming_count=N indefinitely when their
    # provisioning gets stuck.
    instance_pool_replenisher:
      every: '60s'
      class: System::InstancePoolReplenisherJob
      queue: default
      description: 'Recycle stale + replenish active instance pools'

    # CI runner lease reconcile - every 60 seconds (campaign 019f5885 inc3).
    # Correlates each active CiRunnerLease against Gitea run state + publish
    # arrival, drives it toward release + recycle, and reaps orphaned fleet-*
    # runners. Server-side sweep (worker is HTTP-only).
    ci_runner_lease_reconcile:
      every: '60s'
      class: System::CiRunnerLeaseReconcileJob
      queue: default
      description: 'Reconcile CI runner leases (Gitea run state, release + recycle)'

    # Docker Swarm health check - every 10 minutes
    swarm_health_check:
      every: '10m'
      class: Swarm::HealthCheckJob
      queue: devops_default
      description: 'Check Docker Swarm cluster health'

    # Docker Swarm event cleanup - daily at 5 AM UTC
    swarm_event_cleanup:
      cron: '0 5 * * *'
      class: Swarm::EventCleanupJob
      queue: maintenance
      description: 'Clean up old acknowledged swarm events'

    # Docker Host sync - every 10 minutes
    docker_host_sync:
      cron: '*/10 * * * *'
      class: Docker::HostSyncJob
      queue: devops_default
      description: 'Sync Docker host container and image state'

    # Git Runner status reconcile against provider (authoritative) - every 10 minutes
    git_runner_health_check:
      every: '10m'
      class: Git::RunnerHealthCheckJob
      queue: devops_default
      description: 'Reconcile Git runner statuses from the provider; mark offline only runners the provider no longer reports'

    # Git CI pipeline status ingestion - every 10 minutes (keeps Devops::GitPipeline populated)
    git_pipeline_sync:
      every: '10m'
      class: Git::PipelineSyncSchedulerJob
      queue: services
      description: 'Enqueue PipelineSyncJob for active git repos so CI pipeline status (Devops::GitPipeline) stays current'

    # Docker Host health check - every 10 minutes
    docker_health_check:
      every: '10m'
      class: Docker::HealthCheckJob
      queue: devops_default
      description: 'Check Docker host connectivity and health'

    # Docker event cleanup - daily at 5:15 AM UTC
    docker_event_cleanup:
      cron: '15 5 * * *'
      class: Docker::EventCleanupJob
      queue: maintenance
      description: 'Clean up old acknowledged Docker events'

    # AI Provider model sync - daily full sweep, early morning UTC (after the
    # 1 AM pricing sync). Backstop for the pending sweep below — also covers
    # providers that never get flagged (e.g. upstream added models without
    # any local config change).
    ai_provider_model_sync:
      cron: '30 1 * * *'
      class: AiProviderModelSyncJob
      queue: ai_orchestration
      description: 'Daily full sweep: sync AI provider models and pricing from upstream APIs'

    # AI Provider pending model sync - every 5 minutes. Providers flag
    # themselves sync-pending on create/update (the after_commit no longer
    # fetches inline); this sweep picks the flags up promptly.
    ai_provider_pending_model_sync:
      cron: '*/5 * * * *'
      class: AiProviderPendingSyncJob
      queue: ai_orchestration
      description: 'Sync model lists for providers flagged sync-pending on create/update'

    # AI Provider health check - every 10 minutes
    ai_provider_health_check:
      every: '10m'
      class: AiProviderHealthCheckJob
      queue: ai_orchestration
      description: 'Check AI provider health and connectivity'

    # AI Memory Pool cleanup - daily at 3:30 AM UTC
    ai_memory_pool_cleanup:
      cron: '30 3 * * *'
      class: AiMemoryPoolCleanupJob
      queue: ai_orchestration
      description: 'Clean up expired AI memory pools'

    # Compound Learning maintenance - daily decay and cross-team promotion
    ai_compound_learning_maintenance:
      cron: '45 3 * * *'
      class: AiCompoundLearningMaintenanceJob
      queue: ai_orchestration
      description: 'Decay stale compound learnings and promote cross-team knowledge'

    # Memory maintenance - daily consolidation, decay, and rot detection
    ai_memory_maintenance:
      cron: '0 4 * * *'
      class: AiMemoryMaintenanceJob
      queue: ai_orchestration
      description: 'Run memory tier consolidation, decay pipelines, and auto-archive stale entries'

    # Auth artifact cleanup - daily purge of stale sessions, tokens, orphaned agents
    auth_artifact_cleanup:
      cron: '0 3 * * *'  # Daily at 3:00 AM UTC
      class: AuthCleanupJob
      queue: maintenance
      description: 'Clean up stale MCP sessions, expired tokens, and orphaned agents'

    # Chat session cleanup - idle/close stale sessions every 6 hours
    chat_session_cleanup:
      cron: '0 */6 * * *'
      class: ChatSessionCleanupJob
      queue: maintenance
      description: 'Clean up stale chat sessions (idle active, close old idle)'

    # AI team message cleanup - remove old messages daily at 4 AM UTC
    ai_team_message_cleanup:
      cron: '0 4 * * *'
      class: AiTeamMessageCleanupJob
      queue: ai_orchestration
      description: 'Clean up old AI team messages based on channel retention policy'

    # Trust score decay - apply temporal decay to idle agents
    ai_trust_decay:
      cron: '0 2 * * *'
      class: AiTrustDecayJob
      queue: ai_orchestration
      description: 'Apply temporal decay to trust scores of idle agents'

    # Budget rollover - create new period budgets for expired ones
    ai_budget_rollover:
      cron: '0 * * * *'
      class: AiBudgetRolloverJob
      queue: ai_orchestration
      description: 'Roll over expired agent budgets to new periods'

    # Budget reconciliation - verify transaction ledger matches spent_cents
    ai_budget_reconciliation:
      cron: '0 4 * * *'
      class: AiBudgetReconciliationJob
      queue: ai_orchestration
      description: 'Reconcile budget transaction ledger with spent_cents totals'

    # AI model pricing sync - fetch latest pricing from LiteLLM
    ai_pricing_sync:
      cron: '0 1 * * *'
      class: AiPricingSyncJob
      queue: ai_orchestration
      description: 'Sync AI model pricing from LiteLLM community data'

    # Skill lifecycle daily maintenance - conflict scan, auto-resolve, stale decay
    ai_skill_lifecycle_daily:
      cron: '15 4 * * *'
      class: AiSkillLifecycleMaintenanceJob
      queue: ai_orchestration
      args: ['daily']
      description: 'Daily skill lifecycle maintenance: conflict scan, auto-resolve, stale decay'

    # Skill lifecycle weekly maintenance - prompt refinements, gap detection, effectiveness
    ai_skill_lifecycle_weekly:
      cron: '0 5 * * 0'
      class: AiSkillLifecycleMaintenanceJob
      queue: ai_orchestration
      args: ['weekly']
      description: 'Weekly skill lifecycle maintenance: prompt refinements, gap detection'

    # Skill lifecycle monthly maintenance - re-embed, comprehensive health report
    ai_skill_lifecycle_monthly:
      cron: '0 3 1 * *'
      class: AiSkillLifecycleMaintenanceJob
      queue: ai_orchestration
      args: ['monthly']
      description: 'Monthly skill lifecycle maintenance: re-embed skills, health report'

    # F5: skill-health-driven evolution proposals - scan low-effectiveness skills
    # and active conflicts, file operator-review recommendations. Propose-only
    # (never activates a version or resolves a conflict); gated behind
    # skill_scheduled_evolution (default OFF).
    ai_skill_evolution_proposal:
      cron: '30 4 * * *'  # Daily at 4:30 AM UTC (after skill lifecycle daily maintenance)
      class: AiSkillEvolutionProposalJob
      queue: ai_orchestration
      description: 'Scan skill health/conflicts and file operator-review evolution proposals (propose-only)'

    # Shared knowledge maintenance - import learnings and recalculate quality scores
    ai_shared_knowledge_maintenance:
      cron: '30 4 * * *'
      class: AiSharedKnowledgeMaintenanceJob
      queue: ai_orchestration
      description: 'Import high-importance learnings into shared knowledge and recalculate quality scores'

    # Knowledge graph maintenance - decay confidence and recalculate quality scores
    ai_knowledge_graph_maintenance:
      cron: '45 4 * * *'
      class: AiKnowledgeGraphMaintenanceJob
      queue: ai_orchestration
      description: 'Decay knowledge graph node confidence and recalculate quality scores'

    # Scheduled learning verification (C4) - outcome-based heuristic verify/dispute pass
    ai_learning_verification:
      cron: '50 4 * * *'  # Daily at 4:50 AM UTC (after knowledge graph maintenance)
      class: AiLearningVerificationJob
      queue: ai_orchestration
      description: 'Verify/dispute unverified active learnings by measured effectiveness+confidence (default OFF via :compound_learning_scheduled_verification)'

    # Scheduled learning-cluster -> skill promotion proposals (P3) - clusters
    # high-value learnings and files operator-review SkillProposals
    ai_cluster_promotion:
      cron: '10 5 * * *'  # Daily at 5:10 AM UTC (after learning verification)
      class: AiClusterPromotionJob
      queue: ai_orchestration
      description: 'Cluster high-value learnings and file operator-review skill-promotion proposals (propose-only, default OFF via :learning_to_skill_promotion)'

    # Knowledge documentation sync - export MCP knowledge to markdown fallback docs
    ai_knowledge_doc_sync:
      cron: '30 5 * * *'  # Daily at 5:30 AM UTC (after all maintenance jobs)
      class: AiKnowledgeDocSyncJob
      queue: maintenance
      description: 'Sync MCP knowledge stores to markdown docs for offline fallback'

    # Daily summary generation — one Markdown metrics-snapshot Page per active
    # account for yesterday, via the server admin API.
    # Runbook: docs/operations/daily-summaries.md.
    daily_summary_generation:
      cron: '0 6 * * *'  # Every day at 6:00 AM UTC (after the 2-5 AM maintenance sweeps)
      class: DailySummaryJob
      queue: maintenance
      description: 'Generate per-account daily summary Pages for yesterday'

    # Self-healing monitor - checks degraded providers, orphaned executions
    ai_self_healing_monitor:
      every: '10m'
      class: AiSelfHealingMonitorJob
      queue: ai_orchestration
      description: 'AI system self-healing: detect and remediate degraded/orphaned resources'

    # Data-source subscription monitor - every 5 minutes. Thin cron trigger; the
    # server-side Ai::DataSources::MonitorService walks due subscriptions, runs
    # the governed fetch, change-detects (etag/checksum), warms the cache and
    # emits a data_source_changed signal on change.
    ai_data_source_monitor:
      cron: '*/5 * * * *'
      class: AiDataSourceMonitorJob
      queue: ai_orchestration
      description: 'Poll due data-source subscriptions, change-detect, warm cache + signal on change'

    # Data-source health sweep - every 10 minutes. Refreshes health_status for
    # all active sources via MonitorService#health_tick.
    ai_data_source_health:
      cron: '*/10 * * * *'
      class: AiDataSourceHealthJob
      queue: ai_orchestration
      description: 'Refresh health_status for active data sources'

    # Data-source schema sync - nightly at 04:00. Thin cron trigger; the
    # server-side Ai::DataSources::SchemaSyncService samples schema-tracked (or
    # baseline-less) endpoints and records an inferred schema version.
    ai_data_source_schema_sync:
      cron: '0 4 * * *'
      class: AiDataSourceSchemaSyncJob
      queue: ai_orchestration
      description: 'Sample schema-tracked endpoints and record inferred schema versions'

    # Trajectory analysis - generate improvement recommendations per account
    ai_trajectory_analysis:
      cron: '0 5 * * *'  # Daily at 5:00 AM UTC
      class: AiTrajectoryAnalysisJob
      queue: ai_orchestration
      description: 'Analyze execution trajectories and generate improvement recommendations'

    # Observation pipeline - collect sensor data for autonomous agents
    ai_observation_pipeline:
      every: '15m'
      class: AiObservationPipelineJob
      queue: ai_orchestration
      description: 'Run observation sensors for autonomous agents and create observations'

    # OODA closure driver — drives RalphLoopClosureService cycles for agents
    # with active goals. Inert until the operator enables the
    # ai.autonomy.closure_driver_enabled SiteSetting (server-side gate).
    ai_closure_driver:
      every: '15m'
      class: AiClosureDriverJob
      queue: ai_orchestration
      description: 'Drive OODA closure cycles for autonomous agents (server-gated, default off)'

    # Goal maintenance - auto-abandon stale goals
    ai_goal_maintenance:
      cron: '30 4 * * *'  # Daily at 4:30 AM UTC
      class: AiGoalMaintenanceJob
      queue: maintenance
      description: 'Auto-abandon goals with no progress for 30+ days'

    # Observation cleanup - delete expired and old processed observations
    ai_observation_cleanup:
      cron: '45 4 * * *'  # Daily at 4:45 AM UTC
      class: AiObservationCleanupJob
      queue: maintenance
      description: 'Delete expired and old processed observations'

    # Escalation timeout - auto-escalate overdue escalations
    ai_escalation_timeout:
      every: '15m'
      class: AiEscalationTimeoutJob
      queue: ai_orchestration
      description: 'Auto-escalate overdue escalations to next level in chain'

    # Proposal expiry - expire overdue unreviewed proposals
    ai_proposal_expiry:
      cron: '0 * * * *'  # Every hour
      class: AiProposalExpiryJob
      queue: maintenance
      description: 'Expire unreviewed proposals past their review deadline'

    ai_approval_expiry:
      cron: '0 * * * *'  # Every hour
      class: AiApprovalExpiryJob
      queue: maintenance
      description: 'Expire overdue approval requests (honours chain timeout_action)'

    # Provisioning parked-step janitor - re-drive steps whose approval settled
    # but whose synchronous resume never ran (process death between the two).
    ai_provisioning_parked_step_reap:
      cron: '*/15 * * * *'
      class: AiProvisioningParkedStepReaperJob
      queue: maintenance
      description: 'Resume provisioning steps stranded in awaiting_approval after their approval settled'

    # Intervention policy tuning - analyze patterns and suggest policy adjustments
    ai_intervention_policy_tuning:
      cron: '0 6 * * 0'  # Weekly at 6:00 AM UTC on Sunday
      class: AiInterventionPolicyTuningJob
      queue: maintenance
      description: 'Analyze approval patterns and suggest intervention policy adjustments'

    # Container instance reconciliation - detect stale/crashed containers
    container_instance_reconciliation:
      cron: '*/10 * * * *'
      class: Devops::ContainerInstanceReconciliationJob
      queue: devops_default
      description: 'Reconcile container instance statuses with Docker reality'

    # Port allocation cleanup - release expired port allocations
    port_allocation_cleanup:
      cron: '*/30 * * * *'
      class: Devops::PortAllocationCleanupJob
      queue: devops_default
      description: 'Release expired port allocations to prevent port exhaustion'

    # Integration health check - monitor third-party integration connectivity
    integration_health_check:
      cron: '*/15 * * * *'
      class: Integrations::IntegrationHealthCheckJob
      queue: integrations
      description: 'Check third-party integration health and auto-pause failing instances'

    # Template maintenance - archive stale templates, clean old builds (weekly)
    template_maintenance:
      cron: '0 3 * * 0'
      class: Devops::TemplateMaintenanceJob
      queue: devops_default
      description: 'Archive unused templates and clean up old container image builds'

    # Ralph loop scheduler - find and execute due ralph loops
    ai_ralph_loop_scheduler:
      cron: '* * * * *'  # Every minute
      class: AiRalphLoopSchedulerJob
      queue: ai_orchestration
      description: 'Check for due ralph loops and execute scheduled iterations'

    # G11 gate-integrity canary — daily failure-injection check that the
    # verification gate still fails closed. Feeds fixed known-good/known-bad
    # inputs through the live gate (server-side) and alerts if any verdict has
    # silently regressed (e.g. real-test verification turning into always-pass).
    ai_gate_canary:
      cron: '50 3 * * *'  # Every day at 3:50 AM UTC (after the nightly reapers)
      class: AiGateCanaryJob
      queue: ai_orchestration
      description: 'Inject known-good/known-bad inputs through the verification gate; alert if it stops failing closed'

    # G7 token-scope / permission-creep audit — monthly review of access scopes on
    # active AI provider credentials + API tokens. Flags over-provisioning
    # (wildcard / admin / unrestricted / off-baseline scopes) and alerts so broad
    # grants don't accumulate silently. Returns ids + scope names only (no secrets).
    ai_token_scope_audit:
      cron: '0 4 1 * *'  # Monthly, 1st day at 4:00 AM UTC (~30-day cadence)
      class: AiTokenScopeAuditJob
      queue: ai_orchestration
      description: 'Audit credential/API-token access scopes for over-provisioning; alert on permission creep'

    # Campaign auto-land: drain the approved-land queue (one active land per
    # account/target) and drive each through stage → CI → merge → verify.
    ai_campaign_land_scheduler:
      cron: '* * * * *'  # Every minute
      class: AiCampaignLandSchedulerJob
      queue: ai_orchestration
      description: 'Pick eligible campaign lands and dispatch the land pipeline'

    # Campaign discovery: turn standing improvement signals into deduped campaign
    # proposals (the discovery half of the discovery/delegation control plane).
    ai_campaign_discovery:
      cron: '*/30 * * * *'  # Every 30 minutes
      class: AiCampaignDiscoveryJob
      queue: ai_orchestration
      description: 'Continual discovery: turn improvement signals into campaign proposals'

    # Stigmergic signal decay - apply temporal decay to signal strengths
    ai_stigmergic_signal_decay:
      cron: '*/30 * * * *'  # Every 30 minutes
      class: AiStigmergicSignalDecayJob
      queue: ai_orchestration
      description: 'Decay stigmergic signal strengths and expire dead signals'

    # Pressure field measurement - measure quality pressure on tracked artifacts
    ai_pressure_field_measurement:
      cron: '*/30 * * * *'  # Every 30 minutes
      class: AiPressureFieldMeasurementJob
      queue: ai_orchestration
      description: 'Re-measure pressure fields and broadcast changes'

    # Pressure field decay - apply temporal decay to pressure values
    ai_pressure_field_decay:
      cron: '0 * * * *'  # Every hour at minute 0
      class: AiPressureFieldDecayJob
      queue: ai_orchestration
      description: 'Apply exponential decay to pressure field values'

    # Skill auto-evolution - mutate underperforming skills weekly
    ai_skill_auto_evolution:
      cron: '0 5 * * 1'  # Weekly at 5:00 AM UTC on Monday
      class: AiSkillAutoEvolutionJob
      queue: ai_orchestration
      description: 'Find and mutate underperforming skills using failure analysis'

    # Governance scan - periodic scan of all active agents
    ai_governance_scan:
      cron: '0 */6 * * *'  # Every 6 hours
      class: AiGovernanceScanJob
      queue: ai_orchestration
      description: 'Scan active agents for policy violations, anomalies, and resource abuse'

    # Collusion detection - weekly pairwise analysis of agent behavior
    ai_collusion_detection:
      cron: '0 3 * * 0'  # Weekly at 3:00 AM UTC on Sunday
      class: AiCollusionDetectionJob
      queue: ai_orchestration
      description: 'Detect potential collusion patterns between agent pairs'

    # P2.5.5 — ACME cert renewal sweep every 6h. The job hits a worker_api
    # endpoint that walks system_acme_certificates rows with status pending
    # or expiry within 30d, calls Acme::CertificateManager#renew!, and
    # reloads Traefik. Operator can also trigger manually via the cert UI.
    acme_certificate_renewal:
      cron: '0 */6 * * *'  # Every 6 hours
      class: AcmeCertificateRenewalJob
      queue: system
      description: 'Renew Let''s Encrypt certs in the 30-day expiry window'

    # P3.5 — Federation peer heartbeat every 60s. Pulls each active peer
    # row, POSTs /federation_api/heartbeat, advances state machine
    # active⇄degraded based on response. Skipped here if FederationHeartbeatJob
    # is registered elsewhere (e.g. on the worker_api receiver side).
    federation_heartbeat:
      every: '60s'
      class: FederationHeartbeatJob
      queue: system
      description: 'Tick federation peer heartbeats + state machine'

    # Federation mTLS Phase 2 (symmetric) — refresh peer CA anchors hourly so a
    # peer that rotates its CA has its new certs honored within the hour.
    federation_trust_bundle_refresh:
      cron: '40 * * * *'
      class: FederationTrustBundleRefreshJob
      queue: system
      description: 'Refresh symmetric federation peer CA trust bundles'

    # P4.6.9 — Subscription monitor every hour. Renews active subscriptions'
    # grants 7d before expiry; suspends subscriptions whose offerings
    # transitioned to retired (30d grace); flags grant-validation failures.
    federation_subscription_monitor:
      cron: '0 * * * *'  # Every hour at minute 0
      class: FederationSubscriptionMonitorJob
      queue: system
      description: 'Monitor federation service subscriptions for renewal + grant health'

    # P9 — Auto-policy capability sweep every 5 min. Walks every
    # FederationCapability whose policy is auto_periodic /
    # on_match_filter / auto_on_change and dispatches the sync
    # transport. Closes the operator-burden gap that motivated
    # Architectural Fix 1 (FederationManager AI Skill in P4).
    federation_capability_auto_sync:
      cron: '*/5 * * * *'  # Every 5 minutes
      class: FederationCapabilityAutoSyncJob
      queue: system
      description: 'Tick auto-flow FederationCapability rows + dispatch sync transport'

    # P9.2 — Per-peer audit log WORM shipment, daily at 04:30 UTC.
    # Walks every active peer's FleetEvent rows older than 30 days,
    # seals them into sha256-addressed JSON-Lines, records a receipt
    # in system_federation_audit_shipments. Enforces Social Contract
    # commitment #5 (audit transparency) + Architectural Fix 2
    # (WORM-shipped retention).
    federation_audit_shipment:
      cron: '30 4 * * *'  # Every day at 04:30 UTC
      class: FederationAuditShipmentJob
      queue: system
      description: 'WORM-ship per-peer audit log excerpts older than 30 days'

    # P9.5 — Multi-hop migration chain advancement, every 60s.
    # Walks every chain in planned/in_flight status and advances
    # one hop per chain per tick (cooperative scheduling — keeps
    # one long chain from monopolizing the worker, while many
    # short chains progress concurrently). Stalled chains
    # (in_flight without progress > 1h) are skipped here and
    # surfaced as governance findings instead.
    migration_chain_advance:
      every: '60s'
      class: MigrationChainAdvanceJob
      queue: system
      description: 'Advance active multi-hop migration chains by one hop per tick'

    # NOTE: Codebase intelligence re-indexing is handled by Claude Code hooks
    # (codebase-index-marker.sh + codebase-index-apply.sh), not cron.

    # NOTE: Extension scheduled jobs + queues live in each extension's
    # worker/config/sidekiq_*.yml and are merged into the worker by
    # config/application.rb's generic extension scan.