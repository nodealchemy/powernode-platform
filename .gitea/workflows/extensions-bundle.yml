name: Extensions bundle

# Guards the public-extension bundle mechanism (the Gemfile.private private-mode
# bundle + the public-only Gemfile.lock + the repo-root extensions_loader_helper
# discovery). Two invariants:
#
#   1. lockfile-public-only — the COMMITTED server/Gemfile.lock must declare
#      only public-extension gems, so a clone WITHOUT the private submodules can
#      `bundle install --frozen`. Pure bash. (scripts/check-lockfile-public-only.sh)
#
#   2. core-mode-seed — a fresh CORE-mode checkout (public extensions only; no
#      private extensions) must `rails db:seed` cleanly. Regression guard for the
#      class of bug where a core seed reaches a business-only constant, a
#      business-seeded NOT-NULL FK, an extension-owned skill, or a stale data
#      shape that only fails on first create (all of which crashed a fresh
#      core-install db:seed until guarded/relocated).
#
# Runner facts mirror the system extension's proven Gitea CI
# (extensions/system/.gitea/workflows/ci.yaml): this act-runner runs jobs in a
# bridge-network container, so service sidecars are reached via the docker
# bridge gateway 172.17.0.1 (NOT localhost — own loopback; NOT service-name DNS
# — no per-job network), and ports must bind 0.0.0.0:PORT:PORT (a bare
# PORT:PORT is parsed as HostIP="invalid IP" and never published).

on:
  pull_request:
    paths:
      - 'server/Gemfile'
      - 'server/Gemfile.lock'
      - 'server/Gemfile.private'
      - 'extensions_loader_helper.rb'
      - '.gitmodules'
      - 'config/extensions_state.json'
      - 'server/db/seeds.rb'
      - 'server/db/seeds/**'
      - 'scripts/check-lockfile-public-only.sh'
      - '.gitea/workflows/extensions-bundle.yml'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Reap sidecars leaked by a previously cancelled run (act-runner doesn't clean
  # them up on external SIGKILL — they keep ports 5432/6379 bound and the next
  # run's services: block fails to start). Best-effort. Mirrors the system
  # extension CI's ci-hygiene job. core-mode-seed depends on this for a clean slate.
  # ---------------------------------------------------------------------------
  ci-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - name: Reap stale CI sidecar containers (ports 5432/6379)
        run: |
          set +e
          # SCOPED BY AGE — twin of the fix in
          # extensions/system/.gitea/workflows/ci.yaml. The previous form
          # reaped by port AND by a bare `ancestor=` image match with no age
          # or run scoping, so a push to THIS repo destroyed a concurrent
          # powernode-system rspec run's live postgres/redis on the shared
          # runner pool. Both repos must carry the scoping or the unfixed one
          # still reaps the other's sidecars.
          #
          # A job container is created with `/bin/sleep 10800`, so no run can
          # outlive 3h: younger than that may be live, older is orphaned.
          CEILING_SECS=10800
          now=$(date +%s)

          by_port=$(docker ps -a --format '{{.ID}} {{.Ports}}' \
                    | awk '/:6379->|:5432->/ {print $1}')
          by_image=$(docker ps -aq --filter "ancestor=redis:7" \
                                   --filter "ancestor=pgvector/pgvector:pg16")
          candidates=$(printf '%s\n%s\n' "$by_port" "$by_image" | sort -u | sed '/^$/d')

          reap=""
          for id in $candidates; do
            created=$(docker inspect -f '{{.Created}}' "$id" 2>/dev/null)
            [ -z "$created" ] && continue
            ts=$(date -d "$created" +%s 2>/dev/null)
            [ -z "$ts" ] && continue
            age=$(( now - ts ))
            if [ "$age" -gt "$CEILING_SECS" ]; then
              echo "orphan  ($((age/60))m old): $id"
              reap="$reap $id"
            else
              echo "LEAVING ($((age/60))m old, may belong to a live run): $id"
            fi
          done

          if [ -n "$reap" ]; then
            echo "Reaping:$reap"
            echo "$reap" | xargs -r docker rm -f
          else
            echo "no orphaned sidecars older than ${CEILING_SECS}s"
          fi
          exit 0

  # ---------------------------------------------------------------------------
  # The committed lock must be installable on a private-submodule-less clone.
  # Reads the git index (post-checkout == committed), so no submodules needed.
  # ---------------------------------------------------------------------------
  lockfile-public-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Committed lock declares only public-extension gems
        run: bash scripts/check-lockfile-public-only.sh

  # ---------------------------------------------------------------------------
  # A core-mode checkout (public submodules only — private extensions aren't in
  # .gitmodules, so they stay absent) must `rails db:seed` cleanly. Reproduces a
  # fresh core install's seed bootstrap.
  # ---------------------------------------------------------------------------
  core-mode-seed:
    needs: ci-hygiene
    runs-on: ubuntu-24.04
    services:
      postgres:
        # pgvector image: db/schema.rb enables `vector` + `pgcrypto`; the stock
        # postgres image rejects `CREATE EXTENSION vector` during schema:load.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: powernode_test
        ports:
          # Explicit 0.0.0.0 — bare 5432:5432 leaves HostIP="invalid IP" in this
          # act-runner and never actually binds to the host.
          - 0.0.0.0:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 0.0.0.0:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      # test is hermetic + CI-proven (the system extension CI uses it), and the
      # governance seed runs under it (seeds.rb gate is `development? || test?`).
      RAILS_ENV: test
      BUNDLE_FROZEN: "true"
      # Sidecars publish to the host; the bridge-network job reaches them at the
      # docker bridge gateway. Set both the URL form and the discrete vars the
      # parent database.yml reads (host/user/password), so neither path matters.
      DATABASE_URL: postgres://postgres:postgres@172.17.0.1:5432/powernode_test
      DATABASE_HOST: 172.17.0.1
      DATABASE_USER: postgres
      POWERNODE_DATABASE_PASSWORD: postgres
      REDIS_URL: redis://172.17.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          # Public submodules only == core mode. Private extensions aren't in
          # .gitmodules, so recursive checkout leaves them absent — exactly the
          # tree a public clone / core install has.
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.8
          # frozen install (BUNDLE_FROZEN above) proves the committed public-only
          # lock resolves in a core checkout.
          bundler-cache: true
          working-directory: server

      - name: Create database and load schema
        working-directory: server
        run: bundle exec rails db:create db:schema:load

      - name: Seed must bootstrap a fresh core install cleanly
        working-directory: server
        run: bundle exec rails db:seed

      # Post-job sidecar cleanup (normal completion + most cancellations).
      # Pairs with ci-hygiene which catches the SIGKILL case before the next run.
      - name: Reap own sidecars
        if: always()
        run: |
          set +e
          for port in 6379 5432; do
            docker ps --format '{{.ID}} {{.Ports}}' | awk -v p=":$port->" 'index($0, p) {print $1}' | xargs -r docker rm -f
          done
          exit 0
